services:
  cli:
    build:
      context: ./docker/worker
    networks:
      - maskanyone
    command: "python cli.py"
    env_file:
      - ./app.env
    volumes:
      - ./worker:/app
      - ./data/backend:/data
    depends_on:
      - sam2
      - openpose
    restart: on-failure

  sam2:
    build:
      context: ./docker/sam2
    # Host-Port 8086 leitet auf Container-Port 8000 weiter
    ports:
      - "8086:8000"
    networks:
      - maskanyone
    # Uvicorn lauscht intern auf Port 8000 (passend zum CLI-Skript)
    command: "uvicorn main:app --reload --proxy-headers --host 0.0.0.0 --port 8000 --root-path /api"
    env_file:
      - ./app.env
    volumes:
      - ./sam2:/app
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MASKANYONE_GPU_ID:-0}"]
              capabilities: [ gpu ]
    # devices:
    #   - /dev/nvidia0:/dev/nvidia0
    #   - /dev/nvidiactl:/dev/nvidiactl
    #   - /dev/nvidia-uvm:/dev/nvidia-uvm
    #   - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

  openpose:
    build:
      context: ./docker/openpose
    # Host-Port 8083 leitet auf Container-Port 8000 weiter
    ports:
      - "8083:8000"
    networks:
      - maskanyone
    # Uvicorn lauscht intern auf Port 8000
    command: "uvicorn main:app --reload --proxy-headers --host 0.0.0.0 --port 8000 --root-path /api/"
    env_file:
      - ./app.env
    volumes:
      - ./openpose:/app
      - ./docker/openpose/models:/models
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MASKANYONE_GPU_ID:-0}"]
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

networks:
  maskanyone:
    driver: bridge
